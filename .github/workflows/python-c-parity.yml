name: Python BAS2TAP parity against original C
on:
  push:
    branches: [master, python-c-syntax-validation]
    paths:
      - bas2tap.py
      - bas2tap_syntax.py
      - bas2tap.c
      - tests/**
      - .github/workflows/python-c-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm unchanged BAS2TAP 2.6 C reference
        shell: bash
        run: test "$(git hash-object bas2tap.c)" = 0370b681d77833c37a0e6952401ef038a8e85c28
      - name: Read current DEVELOPMENT corpus without changing inputs
        uses: actions/checkout@v4
        with:
          repository: tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT
          ref: be9a6a9e57d669ee1268c36b417c85c51fe54e14
          path: zxux-corpus
          persist-credentials: false
      - name: Port regression and real C byte comparisons — pass 1
        env:
          ZXUX_CORPUS: zxux-corpus/src/bonus/60-programs
          ZXUX_TZX2BAS: zxux-corpus/build/tools/zx-tzx2bas.py
        run: python -m unittest discover -s tests -v
      - name: Reopen sources and repeat full comparison — pass 2
        run: python -m unittest discover -s tests -v
